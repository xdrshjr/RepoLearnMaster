[alembic]
script_location = apps/api/migrations
prepend_sys_path = apps/api
version_path_separator = os
# NOTE: alembic reads this file with the platform locale encoding (GBK on this
# Windows host), so this file must stay ASCII-only. The database URL is read
# from REPOLEARN_DATABASE_URL in migrations/env.py -- never set it here.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
