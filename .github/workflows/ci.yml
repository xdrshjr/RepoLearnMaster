# RepoLearn CI —— spec `docs/plans/repo-learn-hardening/spec.md` §3.2.4 的六个 job。
#
# 设计要点（改这个文件之前先读一遍，否则很容易把门禁改成装饰）：
#
# 1. **六个 job 一一对应 spec 的六条门禁**：`api` / `kernel` / `web` / `e2e-offline`
#    / `e2e-real` / `gates`。`apps/api/tests/test_ci_and_docs.py` 的 T-CI-1..6 用文本
#    断言钉住它们；少一个 job 或漏接一条命令，那条测试当场红。
# 2. **`gates` 是唯一需要配置为 required 的 check**（分支保护只勾这一个）：它没有
#    自己的工作，只声明 `needs` 覆盖其余五个。新增 job 忘了加进 `needs` 时，"required
#    绿灯"才会暴露出来——这正是它存在的理由，别把 `needs` 改成 `if: always()` 蒙过去。
# 3. **Node 一律 22**（不是 20）：`services/agent-kernel` 的 `npm test` 走
#    `node --experimental-strip-types`，真实下限是 22.6；`services/agent-kernel/package.json`
#    的 `engines.node` 与这里必须一致（T-CI-6 / 评审 P1-2）。
# 4. **pnpm 版本显式 pin 到 `12.18.0`**（与根 `package.json` 的 `packageManager` 一致），
#    不依赖 runner 的 corepack 猜测：猜错的症状是 `--frozen-lockfile` 报"lockfile 版本
#    不兼容"，看起来像代码问题，实际只是工具链没对齐（评审 P1-3）。
# 5. **不引入 PyYAML 之类的解析依赖**（spec §10 第 4 条）：本文件只被文本断言读取。
#    首次真跑是第二保险。
# 6. 没有 `continue-on-error`。任何一条门禁被软化，就等于删掉它（spec R2）。

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一分支的新提交取消上一轮：PR 连续 push 时不该堆积六份流水线。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 只读仓库内容。CI 不需要任何写权限，也就不该有。
permissions:
  contents: read

env:
  # 让 Next/Playwright 在 CI 上别尝试下载遥测与浏览器之外的额外东西。
  NEXT_TELEMETRY_DISABLED: "1"
  CI: "true"

jobs:
  # ---------------------------------------------------------------------------
  # api —— 必须在 Windows 上跑：`test_scripts_and_seed.py` 要真的调 PowerShell 5.1
  # 解析 `start.ps1`，Linux runner 上没有 powershell.exe（spec R1）。
  # ---------------------------------------------------------------------------
  api:
    name: api (windows, py${{ matrix.python-version }})
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      # 3.11 挂了不该掩盖 3.12 的信号：两个版本都要出结论。
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: 安装依赖（dev + analysis）
        # analysis 是 tree-sitter 那一组：没有它 G3 永远 missing，锚点会退回 regex。
        run: pip install -e ".[dev,analysis,pdf]"

      - name: ruff
        run: python -m ruff check .

      - name: pytest
        # 全量跑（apps/api/tests + tests），与本地 `python -m pytest -q` 同一条命令。
        run: python -m pytest -q

      - name: 契约漂移
        # `pyproject.toml` 在仓库根，因此这两条都在根目录跑（不设 working-directory）。
        run: python -m repolearn.cli export-openapi --check

  # ---------------------------------------------------------------------------
  # kernel —— @aragon-agent/core 的 sidecar。`npm test` 用 `--experimental-strip-types`，
  # 所以 Node 必须 ≥ 22.6（见本文件顶部第 3 条）。
  # ---------------------------------------------------------------------------
  kernel:
    name: kernel (node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: npm ci
        # 注意：`npm ci` 要求 services/agent-kernel/package-lock.json 存在且与
        # package.json 一致。该目录目前被 pnpm workspace 管着（根 pnpm-lock.yaml），
        # 若这里报 "can only install with an existing package-lock.json"，就把 kernel 的
        # 锁文件补进仓库，**不要**改成 `npm install`（那等于放弃冻结安装）。
        working-directory: services/agent-kernel
        run: npm ci

      - name: npm test
        working-directory: services/agent-kernel
        run: npm test

      - name: npm run typecheck
        working-directory: services/agent-kernel
        run: npm run typecheck

  # ---------------------------------------------------------------------------
  # web —— 契约门禁 + 类型 + vitest + 生产构建。
  # ---------------------------------------------------------------------------
  web:
    name: web (node 22, pnpm 12.18.0)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.18.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: pnpm install --frozen-lockfile
        # 加 devDependency 却不更新 pnpm-lock.yaml 的话，失败就发生在这一步（评审 P1-3）。
        run: pnpm install --frozen-lockfile

      - name: pnpm contracts:check
        # 契约产物漂移门禁（根 package.json 的脚本 → @repolearn/contracts test）。
        run: pnpm contracts:check

      - name: tsc --noEmit
        working-directory: apps/web
        run: npx tsc --noEmit

      - name: vitest run
        working-directory: apps/web
        run: npx vitest run

      - name: next build
        working-directory: apps/web
        run: npx next build

  # ---------------------------------------------------------------------------
  # e2e-offline —— 离线层 playwright：`page.route` 顶替全部 /api/*，零后端零 Key。
  # ---------------------------------------------------------------------------
  e2e-offline:
    name: e2e-offline (playwright, no backend)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.18.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: pnpm install --frozen-lockfile
        run: pnpm install --frozen-lockfile

      # 浏览器二进制单独缓存：`playwright install` 每轮下载 ~130MB，装它一次就够了。
      # key 里带 pnpm-lock.yaml 的哈希：@playwright/test 一升级，缓存自动失效。
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ms-playwright-${{ runner.os }}-

      - name: playwright install --with-deps chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: playwright test
        working-directory: apps/web
        run: npx playwright test

      - name: 上传失败现场
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-offline-report
          if-no-files-found: warn
          retention-days: 7
          path: |
            apps/web/playwright-report
            apps/web/test-results

  # ---------------------------------------------------------------------------
  # e2e-real —— 真链路：fake GitHub + 三进程 + 临时 DB（`scripts/e2e-real.mjs`）。
  # 这是本轮的存在理由之一（spec §9：S4 与 S5 不可裁）。
  # ---------------------------------------------------------------------------
  e2e-real:
    name: e2e-real (fake github + 3 processes)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - uses: pnpm/action-setup@v4
        with:
          version: 12.18.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: 安装 Python 依赖
        run: pip install -e ".[dev,analysis,audio,pdf]"

      - name: pnpm install --frozen-lockfile
        run: pnpm install --frozen-lockfile

      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ms-playwright-${{ runner.os }}-

      - name: playwright install --with-deps chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: python playwright install chromium
        # PDF 的门 `g2` 由**产品自己的判据**决定（`rendering/pdf.py::chromium_available`），
        # 用的是 **Python** playwright 的浏览器缓存。只装 Node 那只，g2 就会是 missing、
        # PDF 永远走打印视图——门禁全绿，而"到底能不能导 PDF"从未被验证（spec R16）。
        run: python -m playwright install chromium

      - name: e2e-real
        # 三进程（kernel / api / web）、隔离 DB 与对象目录、跑完清理；退出码 2 = 端口被占，
        # 与用例失败（1）区分（spec §3.2.6）。
        run: node scripts/e2e-real.mjs

      - name: 上传日志与报告
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-real-report
          if-no-files-found: warn
          retention-days: 7
          path: |
            var/e2e/**/logs
            apps/web/playwright-report
            apps/web/test-results

  # ---------------------------------------------------------------------------
  # gates —— 唯一 required check。没有自己的活，只把五个 job 收成一个结论。
  # ---------------------------------------------------------------------------
  gates:
    name: gates (required)
    runs-on: ubuntu-latest
    timeout-minutes: 1
    needs: [api, kernel, web, e2e-offline, e2e-real]
    steps:
      - name: 全部门禁已通过
        # 走到这里说明上面五个 job 全绿（任一失败，本 job 会被 skip，required check 不绿）。
        # 故意不写 `if: always()`：那会让失败的流水线也报绿。
        run: exit 0
